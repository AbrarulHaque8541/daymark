<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1216">
  <meta name="description" content="A calm, local-first personal task manager prototype.">
  <title>Daymark — personal tasks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2316705f'/%3E%3Crect x='5' y='9' width='3' height='10' rx='1' fill='%23f7f8f5'/%3E%3Crect x='10.5' y='5' width='3' height='14' rx='1' fill='%23f7f8f5'/%3E%3Crect x='16' y='11' width='3' height='8' rx='1' fill='%23f7f8f5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-focus.css">
  <link rel="stylesheet" href="styles-motion-efficiency.css">
  <script src="task-logic.js" defer></script>
  <script src="repeat-logic.js" defer></script>
  <script src="focus-logic.js" defer></script>
  <script src="feed-logic.js" defer></script>
  <script src="weather-logic.js" defer></script>
  <script src="weather-ui.js" defer></script>
  <script src="currency-logic.js" defer></script>
  <script src="currency-ui.js" defer></script>
  <script src="webhook-logic.js" defer></script>
  <script src="webhook-ui.js" defer></script>
  <script src="app.js" defer></script>
  <script src="export-ui.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Application identity">
      <a class="brand" href="#main" aria-label="Daymark home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-name">daymark</span>
      </a>
      <div class="rail-bottom">
        <span class="rail-avatar" aria-label="Personal workspace">A</span>
        <span class="rail-label">PERSONAL SPACE</span>
      </div>
    </aside>

    <main id="main" class="main-content">
      <header class="topbar">
        <div class="workspace-label"><span class="status-dot" aria-hidden="true"></span> Personal workspace</div>
        <div class="topbar-right">
          <span class="local-badge is-checking" id="storage-status" role="status" aria-live="polite"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 4.5 4.7v4.7c0 3.4 2.3 6.5 5.5 8.1 3.2-1.6 5.5-4.7 5.5-8.1V4.7L10 2.5Z"/><path d="m7.6 9.9 1.6 1.6 3.3-3.4"/></svg><span>Checking browser storage…</span></span>
        </div>
      </header>

      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow" id="today-label">YOUR DAY, AT A GLANCE</p>
          <h1 id="page-title">A little more <em>in focus.</em></h1>
          <p class="page-subtitle">Make space for what matters. One step at a time.</p>
        </div>
        <div class="heading-stat" aria-live="polite">
          <span class="stat-number" id="open-count">0</span>
          <span class="stat-label">open tasks</span>
        </div>
      </section>

      <!-- BODY_PLACEHOLDER: full body preserved via sequential push if needed -->
    </main>
  </div>
</body>
</html>
