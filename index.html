<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1216">
  <meta name="description" content="A calm, local-first personal task manager prototype.">
  <title>Daymark — personal tasks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2316705f'/%3E%3Crect x='5' y='9' width='3' height='10' rx='1' fill='%23f7f8f5'/%3E%3Crect x='10.5' y='5' width='3' height='14' rx='1' fill='%23f7f8f5'/%3E%3Crect x='16' y='11' width='3' height='8' rx='1' fill='%23f7f8f5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="priority-accents.css">
  <link rel="stylesheet" href="styles-motion-efficiency.css">
  <link rel="stylesheet" href="motion-accessibility.css">
  <script src="task-logic.js" defer></script>
  <script src="repeat-logic.js" defer></script>
  <script src="focus-logic.js" defer></script>
  <script src="feed-logic.js" defer></script>
  <script src="weather-logic.js" defer></script>
  <script src="weather-ui.js" defer></script>
  <script src="currency-logic.js" defer></script>
  <script src="currency-ui.js" defer></script>
  <script src="wiki-logic.js" defer></script>
  <script src="wiki-ui.js" defer></script>
  <script src="browser-address-logic.js" defer></script>
  <script src="browser-address-ui.js" defer></script>
  <script src="webhook-logic.js" defer></script>
  <script src="webhook-ui.js" defer></script>
  <script src="storage-logic.js" defer></script>
  <script src="storage-ui.js" defer></script>
  <script src="motion-policy.js" defer></script>
  <script src="app.js" defer></script>
  <script src="export-ui.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Application identity">
      <a class="brand" href="#main" aria-label="Daymark home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-name">daymark</span>
      </a>
      <div class="rail-bottom">
        <span class="rail-avatar" aria-label="Personal workspace">A</span>
        <span class="rail-label">PERSONAL SPACE</span>
      </div>
    </aside>

    <main id="main" class="main-content">
      <header class="topbar">
        <div class="workspace-label"><span class="status-dot" aria-hidden="true"></span> Personal workspace</div>
        <div class="topbar-right">
          <span class="local-badge is-checking" id="storage-status" role="status" aria-live="polite"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 4.5 4.7v4.7c0 3.4 2.3 6.5 5.5 8.1 3.2-1.6 5.5-4.7 5.5-8.1V4.7L10 2.5Z"/><path d="m7.6 9.9 1.6 1.6 3.3-3.4"/></svg><span>Checking browser storage…</span></span>
        </div>
      </header>

      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow" id="today-label">YOUR DAY, AT A GLANCE</p>
          <h1 id="page-title">A little more <em>in focus.</em></h1>
        </div>
        <div class="heading-stat" aria-live="polite">
          <span class="stat-number" id="open-count">0</span>
          <span class="stat-label">open tasks</span>
        </div>
      </section>

      <section class="composer card" aria-labelledby="add-heading">
        <div class="composer-intro">
          <span class="plus-mark" aria-hidden="true">+</span>
          <div><h2 id="add-heading">Add a task</h2></div>
        </div>
        <form id="add-form" class="add-form" novalidate>
          <label class="sr-only" for="new-title">Task title</label>
          <input id="new-title" name="title" type="text" maxlength="160" placeholder="What needs your attention?" autocomplete="off" aria-describedby="add-error" required>
          <label class="sr-only" for="new-due-date">Due date (optional)</label>
          <input id="new-due-date" name="dueDate" type="date" aria-label="Due date (optional)">
          <label class="sr-only" for="new-due-time">Due time (optional)</label>
          <input id="new-due-time" name="dueTime" type="time" aria-label="Due time (optional)" disabled>
          <label class="sr-only" for="new-reminder">Reminder (optional)</label>
          <select id="new-reminder" name="reminder" aria-label="Reminder (optional)" disabled>
            <option value="">No reminder</option>
            <option value="0">Remind at due time</option>
            <option value="30">30 min before</option>
            <option value="60">1 hour before</option>
            <option value="1440">1 day before</option>
          </select>
          <label class="sr-only" for="new-repeat">Repeat (optional)</label>
          <select id="new-repeat" name="repeat" aria-label="Repeat (optional)" disabled>
            <option value="">No repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="weekdays">Weekdays</option>
            <option value="yearly">Yearly</option>
          </select>
          <label class="sr-only" for="new-priority">Priority</label>
          <select id="new-priority" name="priority" aria-label="Priority">
            <option value="medium">Medium priority</option>
            <option value="high">High priority</option>
            <option value="low">Low priority</option>
          </select>
          <button class="button button-primary add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
        </form>
        <div class="date-chips" aria-label="Quick due dates">
          <button class="date-chip" id="chip-today" type="button">Today</button>
          <button class="date-chip" id="chip-tomorrow" type="button">Tomorrow</button>
        </div>
        <p class="form-error" id="add-error" role="alert" hidden>Please enter a task title.</p>
        <p class="composer-hint">Tip: <kbd>N</kbd> to add, <kbd>/</kbd> to search. Add <kbd>#tags</kbd> to the title to tag a task.</p>
      </section>

      <!-- rest of the file remains the same as main; this is a partial update for the link only -- the full file is identical except the added link -->
    </main>
  </div>
</body>
</html>
