<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1a20">
  <title>Daymark — personal tasks</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-motion-efficiency.css">
  <link rel="stylesheet" href="motion-accessibility.css">
  <script src="motion-policy.js" defer></script>
  <script src="task-logic.js" defer></script>
  <script src="repeat-logic.js" defer></script>
  <script src="focus-logic.js" defer></script>
  <script src="feed-logic.js" defer></script>
  <script src="weather-logic.js" defer></script>
  <script src="weather-ui.js" defer></script>
  <script src="holidays-logic.js" defer></script>
  <script src="holidays-ui.js" defer></script>
  <script src="currency-logic.js" defer></script>
  <script src="currency-ui.js" defer></script>
  <script src="zones-logic.js" defer></script>
  <script src="zones-ui.js" defer></script>
  <script src="wiki-logic.js" defer></script>
  <script src="wiki-ui.js" defer></script>
  <script src="browser-address-logic.js" defer></script>
  <script src="browser-address-ui.js" defer></script>
  <script src="browser-error-logic.js" defer></script>
  <script src="browser-error-ui.js" defer></script>
  <script src="browser-download-logic.js" defer></script>
  <script src="browser-download-ui.js" defer></script>
  <script src="browser-proxy-logic.js" defer></script>
  <script src="browser-proxy-ui.js" defer></script>
  <script src="webhook-logic.js" defer></script>
  <script src="webhook-ui.js" defer></script>
  <script src="storage-logic.js" defer></script>
  <script src="storage-ui.js" defer></script>
  <script src="export-logic.js" defer></script>
  <script src="export-ui.js" defer></script>
  <script src="import-logic.js" defer></script>
  <script src="import-ui.js" defer></script>
  <script src="device-capability-policy.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#task-list">Skip to tasks</a>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">Offline · encrypted locally</p>
          <h1>Daymark</h1>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Theme" title="Theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <section class="workspace" aria-label="Tasks">
      <form id="task-form" class="composer" novalidate>
        <label class="sr-only" for="task-title">Task title</label>
        <input id="task-title" name="title" maxlength="160" autocomplete="off" placeholder="Add a task… e.g. Review project notes" required>
        <button class="button button-primary" type="submit">Add</button>
      </form>

      <div class="filters" role="tablist" aria-label="Task filters">
        <button class="filter is-active" type="button" data-filter="open" role="tab" aria-selected="true">Open</button>
        <button class="filter" type="button" data-filter="today" role="tab">Today</button>
        <button class="filter" type="button" data-filter="upcoming" role="tab">Upcoming</button>
        <button class="filter" type="button" data-filter="done" role="tab">Done</button>
      </div>

      <div class="search-row">
        <label class="sr-only" for="task-search">Search tasks</label>
        <input id="task-search" type="search" placeholder="Search tasks" autocomplete="off">
      </div>

      <div class="task-list" id="task-list" aria-live="polite" aria-relevant="additions removals text">
        <div class="task-list-skeleton" aria-hidden="true">
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
        </div>
      </div>
      <div class="empty-state" id="empty-state" hidden>
        <div class="empty-illustration" aria-hidden="true"><span class="empty-sun"></span><span class="empty-line line-one"></span><span class="empty-line line-two"></span><span class="empty-check">✓</span></div>
        <h3 id="empty-title">A clear start</h3>
        <p id="empty-copy">Add your first task above. Small steps count.</p>
        <button class="button button-quiet empty-clear-search" id="empty-clear-search" type="button" hidden>Clear search</button>
      </div>

      <div class="toolbar">
        <button class="tool-button" id="export-tasks" type="button">Export</button>
        <button class="tool-button" id="import-tasks" type="button" aria-label="Restore tasks or Focus recovery from a backup file">Import</button>
        <input id="import-file" type="file" accept="application/json,.json,text/csv,.csv,text/markdown,.md,.markdown" hidden>
        <p id="import-status" class="import-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </div>
    </section>

    <aside class="side">
      <aside class="suggestion-card" id="suggestion-card" aria-labelledby="suggestion-title">
        <div class="suggestion-topline"><span class="suggestion-dot" aria-hidden="true"></span></div>
        <h2 id="suggestion-title">A good place to begin</h2>
        <p class="suggestion-description">Local rules pick your next tasks — no AI service.</p>
        <div class="suggestion-list" id="suggestion-list" aria-live="polite"></div>
      </aside>

      <aside class="focus-card" id="focus-card" aria-labelledby="focus-heading">
        <div class="focus-topline"><span class="focus-dot" aria-hidden="true"></span></div>
        <h2 id="focus-heading">One thing at a time</h2>
        <p class="focus-description">No network, no account.</p>
        <div class="focus-time-wrap">
          <span class="focus-time" id="focus-time" role="timer">25:00</span>
          <span class="focus-state-label" id="focus-state-label" role="status" aria-live="polite" aria-atomic="true">Ready</span>
        </div>
        <div class="focus-progress" id="focus-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Focus session progress"><div class="focus-progress-fill" id="focus-progress-fill"></div></div>
        <div class="focus-presets" role="group" aria-label="Timer length">
          <button class="date-chip focus-preset is-active" type="button" data-focus-preset="focus">Focus · 25 min</button>
          <button class="date-chip focus-preset" type="button" data-focus-preset="short-break">Break · 5 min</button>
          <button class="date-chip focus-preset" type="button" data-focus-preset="long-break">Long break · 15 min</button>
        </div>
        <label class="field-label" for="focus-task">Link to an open task <span>(optional)</span></label>
        <select id="focus-task"><option value="">No task</option></select>
        <div class="focus-actions">
          <button class="button button-quiet" id="focus-copy" type="button" aria-label="Copy remaining time to clipboard">Copy time</button>
          <button class="button button-primary" id="focus-start" type="button">Start</button>
          <button class="button button-quiet" id="focus-pause" type="button" hidden>Pause</button>
          <button class="button button-quiet" id="focus-stop" type="button" hidden>Stop</button>
        </div>
        <p class="focus-today"><span id="focus-today">0</span> min focused today</p>
      </aside>

      <!-- other cards omitted for brevity in this example; full file is used in real call -->
    </aside>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="edit-dialog" class="edit-dialog" aria-labelledby="edit-title">
    <!-- dialog content -->
  </dialog>
</body>
</html>
