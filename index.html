<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1216">
  <meta name="description" content="A calm, local-first personal task manager prototype.">
  <title>Daymark — personal tasks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2316705f'/%3E%3Crect x='5' y='9' width='3' height='10' rx='1' fill='%23f7f8f5'/%3E%3Crect x='10.5' y='5' width='3' height='14' rx='1' fill='%23f7f8f5'/%3E%3Crect x='16' y='11' width='3' height='8' rx='1' fill='%23f7f8f5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-motion-efficiency.css">
  <link rel="stylesheet" href="motion-accessibility.css">
  <script src="task-logic.js" defer></script>
  <script src="repeat-logic.js" defer></script>
  <script src="focus-logic.js" defer></script>
  <script src="feed-logic.js" defer></script>
  <script src="weather-logic.js" defer></script>
  <script src="weather-ui.js" defer></script>
  <script src="holidays-logic.js" defer></script>
  <script src="holidays-ui.js" defer></script>
  <script src="currency-logic.js" defer></script>
  <script src="currency-ui.js" defer></script>
  <script src="wiki-logic.js" defer></script>
  <script src="wiki-ui.js" defer></script>
  <script src="browser-address-logic.js" defer></script>
  <script src="browser-address-ui.js" defer></script>
  <script src="browser-error-logic.js" defer></script>
  <script src="browser-error-ui.js" defer></script>
  <script src="webhook-logic.js" defer></script>
  <script src="webhook-ui.js" defer></script>
  <script src="storage-logic.js" defer></script>
  <script src="storage-ui.js" defer></script>
  <script src="motion-policy.js" defer></script>
  <script src="app.js" defer></script>
  <script src="export-ui.js" defer></script>
  <script src="import-logic.js" defer></script>
  <script src="import-ui.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Application identity">
      <a class="brand" href="#main" aria-label="Daymark home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-name">daymark</span>
      </a>
      <div class="rail-bottom">
        <button type="button" class="icon-button" id="theme-toggle" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
      </div>
    </aside>
    <main id="main" class="workspace">
      <header class="topbar">
        <div class="topbar-identity">
          <p class="eyebrow" id="today-label">Today</p>
          <h1>Tasks</h1>
        </div>
        <div class="topbar-actions">
          <p class="open-count" aria-live="polite"><span id="open-count">0</span> open</p>
          <button type="button" class="text-button" id="sort-toggle">Sort: Smart</button>
        </div>
      </header>
      <section class="composer" aria-label="Add a task">
        <form id="add-form" class="add-form">
          <label class="sr-only" for="new-title">Task title</label>
          <input id="new-title" name="title" type="text" maxlength="160" placeholder="Add a task…" autocomplete="off" required>
          <label class="sr-only" for="new-due">Due date (optional)</label>
          <input id="new-due" name="due" type="date">
          <label class="sr-only" for="new-time">Due time (optional)</label>
          <input id="new-time" name="time" type="time" disabled>
          <label class="sr-only" for="new-reminder">Reminder (optional)</label>
          <select id="new-reminder" name="reminder" aria-label="Reminder (optional)" disabled>
            <option value="">No reminder</option>
            <option value="0">Remind at due time</option>
            <option value="30">30 min before</option>
            <option value="60">1 hour before</option>
            <option value="1440">1 day before</option>
          </select>
          <label class="sr-only" for="new-repeat">Repeat (optional)</label>
          <select id="new-repeat" name="repeat" aria-label="Repeat (optional)" disabled>
            <option value="">No repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="weekdays">Weekdays</option>
            <option value="yearly">Yearly</option>
          </select>
          <label class="sr-only" for="new-priority">Priority</label>
          <select id="new-priority" name="priority" aria-label="Priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <button type="submit" class="primary-button">Add</button>
        </form>
        <div class="composer-extra">
          <label class="sr-only" for="new-notes">Notes (optional)</label>
          <textarea id="new-notes" name="notes" maxlength="4000" rows="2" placeholder="Notes (optional)"></textarea>
          <label class="sr-only" for="new-tags">Tags (optional)</label>
          <input id="new-tags" name="tags" type="text" maxlength="160" placeholder="Tags (space-separated)">
        </div>
      </section>
      <section class="list-tools">
        <div class="search-row">
          <label class="sr-only" for="task-search">Search tasks</label>
          <input id="task-search" class="search-input" type="search" placeholder="Search tasks" autocomplete="off">
          <button type="button" class="text-button" id="clear-search" hidden>Clear</button>
        </div>
        <div class="filter-row">
          <nav class="filters" aria-label="Filter tasks">
            <button type="button" class="filter-button is-active" data-filter="all" aria-pressed="true">All <span id="count-all">0</span></button>
            <button type="button" class="filter-button" data-filter="today" aria-pressed="false">Today <span id="count-today">0</span></button>
            <button type="button" class="filter-button" data-filter="upcoming" aria-pressed="false">Upcoming <span id="count-upcoming">0</span></button>
            <button type="button" class="filter-button" data-filter="week" aria-pressed="false">This week <span id="count-week">0</span></button>
            <button type="button" class="filter-button" data-filter="overdue" aria-pressed="false">Overdue <span id="count-overdue">0</span></button>
            <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">Completed <span id="count-completed">0</span></button>
          </nav>
          <div class="stats-strip" id="stats-strip" hidden aria-label="Your progress">
            <div class="stat-cell"><span class="stat-cell-number" id="stat-done-today">0</span><span class="stat-cell-label">done today</span></div>
            <div class="stat-cell"><span class="stat-cell-number" id="stat-done-week">0</span><span class="stat-cell-label">done this week</span></div>
            <div class="stat-cell"><span class="stat-cell-number" id="stat-streak">0</span><span class="stat-cell-label">day streak</span></div>
          </div>
        </div>
        <p class="visible-count" id="visible-count" aria-live="polite"></p>
        <p class="sr-only" id="search-result-status" role="status"></p>
      </section>
      <section class="task-list-section" aria-label="Task list">
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
        <div id="empty-state" class="empty-state" hidden>
          <p id="empty-title" class="empty-title">No tasks yet</p>
          <p id="empty-copy" class="empty-copy">Add one above to get started.</p>
          <button type="button" class="text-button" id="empty-clear-search" hidden>Clear search</button>
        </div>
        <div class="list-footer">
          <button type="button" class="text-button" id="clear-completed" hidden>Clear completed</button>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
