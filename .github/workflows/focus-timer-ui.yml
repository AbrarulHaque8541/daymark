name: Focus Timer UI and Sound
on:
  pull_request:
    paths:
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerPanel.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerSoundscape.java"
      - "android-app/tools/check-focus-timer-ui.py"
      - "android-app/app/src/main/java/com/abrar/daymark/MainActivity.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusSessionRuntime.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TasksHomeLayoutPolicy.java"
      - "android-app/tools/TasksHomeLayoutPolicySmoke.java"
      - "android-app/tools/run-core-tests.sh"
      - ".github/workflows/focus-timer-ui.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focus-timer-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate Gradle Wrapper JAR
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Provision cached Gradle 8.13
        id: setup-gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        continue-on-error: true
        with:
          gradle-version: '8.13'
          cache-provider: basic
          validate-wrappers: false
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Report Gradle wrapper fallback
        if: steps.setup-gradle.outcome != 'success'
        shell: bash
        run: echo "::warning::Gradle 8.13 cache provisioning did not complete; the checked wrapper retry helper will be used."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Focus Timer UI and sound contract
        run: python3 android-app/tools/check-focus-timer-ui.py
      - name: Assemble Android debug app
        working-directory: android-app
        run: |
          chmod +x gradlew
          bash tools/run-gradle-with-retry.sh --no-daemon :app:assembleDebug
