name: Cross-platform contract tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Validate all GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate every workflow and the negative fixture
        run: bash scripts/validate-workflows.sh

  shared-contracts:
    name: Shared contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install pinned root Node test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --include=dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Node and language-neutral contract tests
        run: npm test
      - name: Run Android production core host tests against shared fixtures
        shell: bash
        run: bash android-app/tools/run-core-tests.sh
      - name: Compile and test platform-neutral device capability core
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          javac --release 17 -encoding UTF-8 -d "$build_dir" shared-core/src/main/java/com/daymark/core/DeviceCapabilityPolicy.java shared-core/src/test/java/com/daymark/core/DeviceCapabilityPolicySmoke.java
          java -ea -cp "$build_dir" com.daymark.core.DeviceCapabilityPolicySmoke contracts/device-capability-policy.tsv
