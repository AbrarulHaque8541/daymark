name: Browser cookie import safety

on:
  pull_request:
    paths:
      - "android-app/app/src/main/java/com/abrar/daymark/BrowserCookieImport*.java"
      - "android-app/tools/BrowserCookieImport*.java"
      - "android-app/tools/run-browser-cookie-import-tests.sh"
      - "android-app/tools/check-browser-cookie-import-saf.py"
      - ".github/workflows/browser-cookie-import-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-cookie-import-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cookie-import-safety:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install pinned root Node test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --include=dev
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Keep this CI workflow on the signed Node 24 Gradle actions and open-source Basic cache.
      - name: Validate Gradle Wrapper JAR
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Provision cached Gradle 8.13
        id: setup-gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        continue-on-error: true
        with:
          gradle-version: '8.13'
          cache-provider: basic
          validate-wrappers: false
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Report Gradle wrapper fallback
        if: steps.setup-gradle.outcome != 'success'
        shell: bash
        run: echo "::warning::Gradle 8.13 cache provisioning did not complete; the checked wrapper retry helper will be used."
      - name: Run repository host regression suite
        run: npm test
      - name: Run parser and import-policy host tests
        run: sh android-app/tools/run-browser-cookie-import-tests.sh
      - name: Verify SAF-only import boundaries
        run: python3 android-app/tools/check-browser-cookie-import-saf.py
      # The repository-wide source guard runs in Android CI and device-test workflows.
      # Keep this focused workflow scoped to cookie-import-specific assertions.
      - name: Grant execute permission for Gradle wrapper
        working-directory: android-app
        run: chmod +x gradlew
      - name: Compile and lint both Android debug flavors
        working-directory: android-app
        run: >-
          bash tools/run-gradle-with-retry.sh --no-daemon
          assembleGithubSideloadDebug
          assemblePlayDebug
          lintGithubSideloadDebug
          lintPlayDebug
          compileGithubSideloadDebugAndroidTestJavaWithJavac
          compilePlayDebugAndroidTestJavaWithJavac
