name: Browser Service Worker runtime acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/browser-service-worker-runtime.yml"
      - "android-app/build.gradle.kts"
      - "android-app/settings.gradle.kts"
      - "android-app/service-worker-test/**"
      - "android-app/tools/run-service-worker-instrumentation-on-emulator.sh"
      - "android-app/app/src/main/java/com/abrar/daymark/BrowserServiceWorkerEnforcement.java"
      - "android-app/app/src/main/java/com/abrar/daymark/BrowserServiceWorkerPolicy.java"
      - "android-app/app/src/main/java/com/abrar/daymark/DaymarkWebView.java"
      - "android-app/app/src/main/java/com/abrar/daymark/BrowserWorkspaceController.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-service-worker-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Service Worker request trace API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run controlled Service Worker server on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          working-directory: android-app
          script: sh tools/run-service-worker-instrumentation-on-emulator.sh
