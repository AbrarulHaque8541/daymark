name: Focus timer Android emulator lifecycle

on:
  # Keep exact-head runtime coverage active for long-running Focus branches even
  # when an older PR base temporarily has merge conflicts.
  push:
    branches:
      - "integration/focus-*"
  pull_request:
    paths:
      - ".github/workflows/focus-timer-emulator.yml"
      - "android-app/app/src/androidTest/java/com/abrar/daymark/DaymarkPlatformInstrumentation.java"
      - "android-app/app/src/androidTest/java/com/abrar/daymark/PlatformTouchSequence.java"
      - "android-app/app/src/androidTest/java/com/abrar/daymark/TaskEditorImeInstrumentation.java"
      - "android-app/app/src/main/java/com/abrar/daymark/MainActivity.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerPanel.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerModeGesturePolicy.java"
      - "android-app/tools/TaskFocusTimerModeGesturePolicySmoke.java"
      - "android-app/tools/run-focus-timer-tests.sh"
      - "android-app/app/src/main/java/com/abrar/daymark/UiMotionPolicy.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusSessionRuntime.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerNotification.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerStore.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerSnapshotCodec.java"
      - "android-app/app/build.gradle.kts"
      - "android-app/tools/check-v1-source.sh"
      - "android-app/tools/run-core-tests.sh"
      - "android-app/tools/run-platform-instrumentation-on-emulator.sh"
      - "android-app/tools/PlatformTouchSequenceSmoke.java"
      - "android-app/tools/run-platform-instrumentation-touch-sequence-tests.sh"
      - "android-app/tools/platform-instrumentation-repeat.sh"
      - "android-app/tools/run-platform-instrumentation-repeat-tests.sh"
      - "android-app/tools/check-focus-emulator-repeat.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus-runtime:
    name: Focus runtime API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # API 36 has had intermittent lifecycle failures. Run the complete suite
    # ten consecutive times on one clean emulator; API 29 remains one baseline.
    # platform-instrumentation-repeat.sh clears only the disposable app package between runs
    # and stops at the first failure; it never retries a failed instrumentation attempt.
    env:
      DAYMARK_FOCUS_EMULATOR_REPEAT_COUNT: ${{ matrix.api-level == 36 && '10' || '1' }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install app and instrumentation APKs, then execute the platform runner
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          working-directory: android-app
          script: |
            adb shell wm size
            adb shell wm density
            adb shell settings get system font_scale
            sh tools/run-platform-instrumentation-on-emulator.sh
