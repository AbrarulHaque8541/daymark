name: Focus timer Android emulator lifecycle

on:
  pull_request:
    paths:
      - ".github/workflows/focus-timer-emulator.yml"
      - "android-app/app/src/androidTest/java/com/abrar/daymark/DaymarkPlatformInstrumentation.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusSessionRuntime.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerNotification.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerStore.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerSnapshotCodec.java"
      - "android-app/app/build.gradle.kts"
      - "android-app/tools/check-v1-source.sh"
      - "android-app/tools/run-core-tests.sh"

permissions:
  contents: read

jobs:
  focus-runtime:
    name: Focus runtime API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Android platform instrumentation on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          working-directory: android-app
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon connectedGithubSideloadDebugAndroidTest
