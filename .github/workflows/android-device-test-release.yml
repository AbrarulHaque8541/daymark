name: Android device-test release

on:
  push:
    tags:
      - 'v*-device-test.*'

permissions:
  contents: write

concurrency:
  group: android-device-test-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-device-test:
    name: Build and publish device-test APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify tag and source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?-device-test\.[0-9]+$ ]]; then
            echo "Expected a vMAJOR.MINOR[-PATCH]-device-test.N tag; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          build_commit="$(git rev-parse HEAD)"
          tagged_commit="$(git rev-parse "${tag_ref}^{commit}")"
          if [[ "$build_commit" != "$tagged_commit" ]]; then
            echo "Checkout does not match the exact commit referenced by $tag_ref" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          app_version="${version%-device-test.*}"
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "build_commit=$build_commit"
            echo "app_version=$app_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Android host regression checks
        shell: bash
        run: |
          set -euo pipefail
          sh ./tools/check-v1-source.sh
          sh ./tools/run-storage-recovery-tests.sh
          sh ./tools/run-updater-picker-routing-tests.sh

      - name: Build and run Android variant checks
        run: >-
          ./gradlew --no-daemon --stacktrace --console=plain
          assembleGithubSideloadDebug
          lintGithubSideloadDebug
          lintPlayDebug
          compileGithubSideloadDebugAndroidTestJavaWithJavac
          compilePlayDebugAndroidTestJavaWithJavac
