name: Android device acceptance artifact (non-publishing)

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - .github/workflows/android-device-acceptance.yml
      - android-app/**
      - contracts/**
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: android-device-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build current-source debug APK for manual device QA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the exact event SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Set up Android SDK API 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Run canonical repository checks
        shell: bash
        run: |
          set -euo pipefail
          npm test
          cd android-app
          sh ./tools/check-v1-source.sh
          python3 ./tools/check-ci-test-honesty.py "$GITHUB_WORKSPACE"

      - name: Build sideload debug APK and compile instrumentation sources
        working-directory: android-app
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon \
            assembleGithubSideloadDebug \
            lintGithubSideloadDebug \
            compileGithubSideloadDebugAndroidTestJavaWithJavac

      - name: Verify APK identity and calculate SHA-256
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="android-app/app/build/outputs/apk/githubSideload/debug/app-githubSideload-debug.apk"
          test -s "$apk"
          unzip -t "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          badging="$RUNNER_TEMP/daymark-debug-badging.txt"
          "$aapt" dump badging "$apk" > "$badging"
          package_name="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" "$badging")"
          version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" "$badging")"
          version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" "$badging)"
          min_sdk="$(sed -n "s/^sdkVersion:[[:space:]]*'\\([^']*\\)'.*/\\1/p" "$badging")"
          target_sdk="$(sed -n "s/^targetSdkVersion:[[:space:]]*'\\([^']*\\)'.*/\\1/p" "$badging")"
          [[ "$package_name" == "com.abrar.daymark" ]]
          [[ "$min_sdk" == "26" && "$target_sdk" == "36" ]]
          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          mkdir -p device-acceptance-payload
          cp "$apk" device-acceptance-payload/Daymark-githubSideload-debug.apk
          {
            echo "tested_source_sha=$GITHUB_SHA"
            echo "pull_request_head_sha=${PR_HEAD_SHA:-not-applicable}"
            echo "application_id=$package_name"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "min_sdk=$min_sdk"
            echo "target_sdk=$target_sdk"
            echo "apk=Daymark-githubSideload-debug.apk"
            echo "apk_sha256=$sha256"
            echo "signing=debug certificate (NOT production signed)"
            echo "purpose=manual non-production device QA only"
          } > device-acceptance-payload/BUILD-METADATA.txt
          {
            echo "### Non-production device-test APK"
            echo
            echo "- Source SHA: `$GITHUB_SHA`"
            echo "- PR head SHA: `${PR_HEAD_SHA:-not-applicable}`"
            echo "- Package: `$package_name`"
            echo "- Version: `$version_name` (code `$version_code`)"
            echo "- Min/target SDK: `$min_sdk` / `$target_sdk`"
            echo "- APK SHA-256: `$sha256`"
            echo
            echo "**Safety:** this debug-signed APK is for manual QA. It cannot update an installed production-signed build in place. Do not uninstall Daymark or use it to test task-data migration.
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-production APK and exact build metadata
        uses: actions/upload-artifact@v4
        with:
          name: daymark-device-acceptance-${{ github.sha }}
          path: device-acceptance-payload/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
