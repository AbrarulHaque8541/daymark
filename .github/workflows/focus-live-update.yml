name: Focus timer Live Update adapter

on:
  pull_request:
    paths:
      - ".github/workflows/focus-live-update.yml"
      - "android-app/app/src/main/AndroidManifest.xml"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerNotification.java"
      - "android-app/tools/check-focus-timer-notification.py"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerSnapshotCodec.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusTimerStore.java"
      - "android-app/app/src/main/java/com/abrar/daymark/TaskFocusSessionRuntime.java"
      - "android-app/app/src/main/java/com/abrar/daymark/MainActivity.java"
      - "android-app/app/src/githubSideload/AndroidManifest.xml"
      - "android-app/tools/check-v1-source.sh"
      - "android-app/tools/run-core-tests.sh"
      - "android-app/tools/TaskFocusTimerSnapshotSmoke.java"
      - "android-app/tools/run-focus-timer-persistence-tests.sh"
      - "android-app/tools/check-merged-manifests.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate Gradle Wrapper JAR
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Provision cached Gradle 8.13
        id: setup-gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        continue-on-error: true
        with:
          gradle-version: '8.13'
          validate-wrappers: false
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Report Gradle wrapper fallback
        if: steps.setup-gradle.outcome != 'success'
        shell: bash
        run: echo "::warning::Gradle 8.13 cache provisioning did not complete; the checked wrapper retry helper will be used."
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Verify Live Update and manifest policy
        run: |
          python3 tools/check-focus-timer-notification.py "$PWD"
          sh tools/run-focus-timer-persistence-tests.sh
          python3 tools/check-merged-manifests.py "$PWD"
      - name: Compile both distribution variants and lint
        run: >-
          bash tools/run-gradle-with-retry.sh --no-daemon
          assembleGithubSideloadDebug
          assemblePlayDebug
          lintGithubSideloadDebug
          lintPlayDebug
