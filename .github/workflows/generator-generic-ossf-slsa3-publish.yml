# SLSA provenance for the Daymark device-test APK.
#
# The round-2 audit found this file was still the untouched upstream template: it
# fabricated `artifact1` / `artifact2` with `echo` and generated SLSA provenance
# for those fake files, so the published attestation described nothing that ships.
# This workflow now builds the real githubSideload APK and generates provenance
# for that exact binary.
#
# The provenance file can be verified with
# https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA visit slsa.dev.

name: SLSA provenance for the device-test APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-device-test.*'

permissions:
  contents: read

jobs:
  build:
    name: Build the real APK and hash it
    # Manual dispatch remains build-only; only the owner may trigger tag builds.
    if: github.event_name != 'push' || (github.actor == 'AbrarulHaque8541' && github.triggering_actor == 'AbrarulHaque8541')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - name: Check out the event ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify device-test tag is on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Build the githubSideload APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleGithubSideloadDebug

      - name: Generate the provenance subject from the real APK
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          apk="android-app/app/build/outputs/apk/githubSideload/debug/app-githubSideload-debug.apk"
          test -s "$apk" || { echo "Built APK is missing or empty: $apk" >&2; exit 1; }
          unzip -t "$apk" >/dev/null
          # The provenance subject is the exact APK that ships, not a placeholder.
          echo "hashes=$(sha256sum "$apk" | base64 -w0)" >> "${GITHUB_OUTPUT}"

  authorize-provenance:
    name: Require production-signing approval before provenance publication
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.actor == 'AbrarulHaque8541' && github.triggering_actor == 'AbrarulHaque8541'
    needs: [build]
    environment: production-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm the protected production environment was approved
        run: echo "Production provenance authorization approved."

  provenance:
    # Manual dispatch is build-only. Signed provenance and release-asset upload
    # are permitted only after the owner-triggered tag build and protected
    # production-signing environment approval have succeeded.
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.actor == 'AbrarulHaque8541' && github.triggering_actor == 'AbrarulHaque8541'
    needs: [build, authorize-provenance]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Optional: Upload to a new release
