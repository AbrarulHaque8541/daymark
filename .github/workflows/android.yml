name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # UI source must be tested exactly as committed. Do not mutate MainActivity during CI.

      - name: Run Android host regression checks
        run: |
          sh ./tools/check-v1-source.sh
          sh ./tools/run-storage-recovery-tests.sh
          sh ./tools/run-updater-picker-routing-tests.sh
          python3 ./tools/check-ci-test-honesty.py "$GITHUB_WORKSPACE"

      - name: Run repository-level Node tests
        working-directory: ${{ github.workspace }}
        run: npm test

      - name: Build and verify debug variants
        run: >-
          ./gradlew --no-daemon
          assembleGithubSideloadDebug
          assemblePlayDebug
          lintGithubSideloadDebug
          lintPlayDebug
          lintGithubSideloadRelease
          compileGithubSideloadDebugAndroidTestJavaWithJavac
          compilePlayDebugAndroidTestJavaWithJavac
