name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install pinned root Node test dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --ignore-scripts --no-audit --no-fund --include=dev

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Validate Gradle Wrapper JAR
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Provision cached Gradle 8.13
        id: setup-gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        continue-on-error: true
        with:
          gradle-version: '8.13'
          cache-provider: basic
          validate-wrappers: false
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Report Gradle wrapper fallback
        if: steps.setup-gradle.outcome != 'success'
        shell: bash
        run: echo "::warning::Gradle 8.13 cache provisioning did not complete; the checked wrapper retry helper will be used."
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # UI source must be tested exactly as committed. Do not mutate MainActivity during CI.

      - name: Run Android host regression checks
        run: |
          sh ./tools/check-v1-source.sh
          sh ./tools/run-storage-recovery-tests.sh
          sh ./tools/run-updater-picker-routing-tests.sh
          python3 ./tools/check-ci-test-honesty.py "$GITHUB_WORKSPACE"

      - name: Run extension injection page-scope host tests
        run: sh ./tools/run-extension-injector-tests.sh

      - name: Run UiMotionPolicy host regression tests
        run: sh ./tools/run-ui-motion-policy-tests.sh

      - name: Run UiFeedbackPolicy host regression tests
        run: sh ./tools/run-ui-feedback-policy-tests.sh

      - name: Run repository-level Node tests
        working-directory: ${{ github.workspace }}
        run: npm test

      - name: Build and verify debug variants
        run: >-
          bash tools/run-gradle-with-retry.sh --no-daemon
          assembleGithubSideloadDebug
          assemblePlayDebug
          lintGithubSideloadDebug
          lintPlayDebug
          lintGithubSideloadRelease
          compileGithubSideloadDebugAndroidTestJavaWithJavac
          compilePlayDebugAndroidTestJavaWithJavac
