name: Android PR device-test validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-pr-device-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build and verify unsigned debug variants
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the event ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK API 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Run web and Android host/source checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          cd android-app
          sh ./tools/run-core-tests.sh
          sh ./tools/run-updater-picker-routing-tests.sh
          sh ./tools/run-attachment-tests.sh
          sh ./tools/run-storage-recovery-tests.sh
          sh ./tools/run-portable-backup-tests.sh
          sh ./tools/check-v1-source.sh
          python3 ./tools/check-accessibility-contrast.py
          python3 ./tools/check-attachment-source.py "$PWD"
          python3 ./tools/check-backup-rules.py
          python3 ./tools/check-portable-archive-bounds.py
          python3 ./tools/check-schema-v1-fixture.py "$PWD"
          python3 ./tools/check-storage-failure-ui.py
          python3 ./tools/check-task-template-source.py "$PWD"
          python3 ./tools/check-ci-test-honesty.py "$GITHUB_WORKSPACE"

      - name: Clean Android build
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean

      - name: Build and check both unsigned debug flavors
        working-directory: android-app
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --continue \
            assembleGithubSideloadDebug \
            assemblePlayDebug \
            lintGithubSideloadDebug \
            lintPlayDebug \
            compileGithubSideloadDebugAndroidTestJavaWithJavac \
            compilePlayDebugAndroidTestJavaWithJavac

      - name: Verify merged manifests
        working-directory: android-app
        run: python3 ./tools/check-merged-manifests.py "$PWD"

      - name: Verify unsigned debug APK identity and archive
        shell: bash
        run: |
          set -euo pipefail
          apk="android-app/app/build/outputs/apk/githubSideload/debug/app-githubSideload-debug.apk"
          test -s "$apk"
          unzip -t "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$sdk_root" && -d "$sdk_root/build-tools" ]]
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -x "$aapt" && -x "$apksigner" ]]
          "$apksigner" verify --verbose --print-certs "$apk"
          badging="$RUNNER_TEMP/daymark-pr-apk-badging.txt"
          "$aapt" dump badging "$apk" > "$badging"
          package_line="$(grep '^package: ' "$badging")"
          app_id="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<< "$package_line")"
          version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<< "$package_line")"
          version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<< "$package_line")"
          min_sdk="$(awk -F"'" '/^sdkVersion:/ {print $2; exit}' "$badging")"
          target_sdk="$(awk -F"'" '/^targetSdkVersion:/ {print $2; exit}' "$badging")"
          [[ "$app_id" == "com.abrar.daymark" ]]
          [[ "$min_sdk" == "26" ]]
          [[ "$target_sdk" == "36" ]]
          [[ -n "$version_code" && -n "$version_name" ]]
