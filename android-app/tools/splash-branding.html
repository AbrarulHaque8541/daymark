<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daymark system splash branding</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 200px; height: 80px; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    main { display: flex; flex-direction: column; align-items: center; }
    .title {
      color: #F6F7F4;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1.2;
      padding-left: 0.22em;
      white-space: nowrap;
    }
    .creator {
      margin-top: 7px;
      color: #7ACCB2;
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 0.18em;
      line-height: 1.3;
      padding-left: 0.18em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main aria-label="DAYMARK, BY ABRARUL HAQUE">
    <div class="title">DAYMARK</div>
    <div class="creator">BY ABRARUL HAQUE</div>
  </main>
</body>
</html>
