<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Daymark Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="browser">
    <div id="tabs"></div>
    <div id="toolbar">
      <button class="navbtn" id="btn-back" title="Back">&#8592;</button>
      <button class="navbtn" id="btn-fwd" title="Forward">&#8594;</button>
      <button class="navbtn" id="btn-reload" title="Reload">&#10227;</button>
      <button class="navbtn" id="btn-home" title="Home">&#8962;</button>
      <input id="urlbar" placeholder="Search or enter address (HTTPS-only)" spellcheck="false" autocomplete="off" />
      <button class="navbtn" id="btn-find" title="Find in page (Ctrl+F)">&#128269;</button>
    </div>
    <div id="views">
      <div id="errorbox">
        <h2 id="err-title">Can't open this page</h2>
        <p id="err-detail"></p>
        <p id="err-hint">Daymark Browser is HTTPS-only: insecure http:// pages are blocked. localhost is allowed for development.</p>
        <button class="navbtn" id="err-dismiss">Back</button>
      </div>
      <div id="findbar">
        <input id="find-input" placeholder="Find in page" spellcheck="false" autocomplete="off" />
        <span id="find-count"></span>
        <button class="navbtn" id="find-prev" title="Previous match">&#8593;</button>
        <button class="navbtn" id="find-next" title="Next match">&#8595;</button>
        <button class="navbtn" id="find-close" title="Close (Esc)">&times;</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
