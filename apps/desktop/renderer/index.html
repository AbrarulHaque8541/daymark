<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Daymark Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="browser">
    <div id="tabs" role="group" aria-label="Open tabs"></div>
    <div id="toolbar" role="group" aria-label="Browser navigation">
      <button class="navbtn" id="btn-back" title="Back" aria-label="Back">&#8592;</button>
      <button class="navbtn" id="btn-fwd" title="Forward" aria-label="Forward">&#8594;</button>
      <button class="navbtn" id="btn-reload" title="Reload" aria-label="Reload page">&#10227;</button>
      <button class="navbtn" id="btn-home" title="Home" aria-label="Home">&#8962;</button>
      <input id="urlbar" type="text" placeholder="Search or enter address (HTTPS-only)" aria-label="Search or enter address" spellcheck="false" autocomplete="off" />
      <button class="navbtn" id="btn-find" title="Find in page (Ctrl+F)" aria-label="Find in page"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
    </div>
    <div id="page-loading-indicator" aria-hidden="true"></div>
    <p id="page-loading-status" class="visually-hidden" role="status"></p>
    <div id="views">
      <div id="errorbox" role="alert" aria-live="assertive">
        <section class="error-card">
          <h2 id="err-title">Can't open this page</h2>
          <p id="err-detail"></p>
          <p id="err-hint">Daymark Browser is HTTPS-only: insecure http:// pages are blocked. localhost is allowed for development.</p>
          <button class="navbtn" id="err-dismiss" aria-label="Dismiss error">Back</button>
        </section>
      </div>
      <div id="findbar" role="search" aria-label="Find in page">
        <input id="find-input" placeholder="Find in page" aria-label="Find text" spellcheck="false" autocomplete="off" />
        <span id="find-count" role="status" aria-live="polite"></span>
        <button class="navbtn" id="find-prev" title="Previous match" aria-label="Previous match">&#8593;</button>
        <button class="navbtn" id="find-next" title="Next match" aria-label="Next match">&#8595;</button>
        <button class="navbtn" id="find-close" title="Close (Esc)" aria-label="Close find in page">&times;</button>
      </div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
